name: Hospital CI
on:
  push:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compilar y ejecutar todas las pruebas
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp verify
      - name: Preparar credenciales temporales para demostracion
        run: python3 scripts/create_env.py
      - name: Levantar arquitectura real
        run: docker compose up -d --build
      - name: Esperar estabilizacion del registro de servicios
        run: |
          sleep 60
          docker compose ps
      - name: Verificar Gateway, Eureka, SQL y RabbitMQ
        run: python3 scripts/smoke.py --docker-checks
      - name: Guardar imagen probada de pacientes para CD
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save hospital-pacientes:${GITHUB_SHA} -o pacientes-image.tar
      - name: Publicar imagen aprobada
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: pacientes-image
          path: pacientes-image.tar
          retention-days: 7
      - name: Capturar logs de ejecucion
        if: always()
        run: |
          mkdir -p evidencias
          if [ -f .env ]; then docker compose logs --no-color > evidencias/docker.log 2>&1; fi
      - name: Guardar reportes y evidencias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/**
            evidencias/smoke-result.json
            evidencias/docker.log
          if-no-files-found: warn
      - name: Apagar servicios temporales de CI
        if: always()
        run: |
          if [ -f .env ]; then docker compose down --volumes; fi
